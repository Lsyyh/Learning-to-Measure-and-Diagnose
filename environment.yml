# Conda environment for the method implementation.
#   conda env create -f environment.yml
# Torch/CUDA builds must match your driver; any torch>=2.1 with a working
# CUDA runtime is fine (the paper results used torch 2.x + CUDA 12/13).
name: radiomics
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch>=2.1
      - torchvision>=0.16
      - pyradiomics==3.0.1
      - SimpleITK>=2.2
      - pillow>=10.0
      - openpyxl>=3.1
      - numpy>=1.24
      - scipy>=1.10
      - pandas>=2.0
      - scikit-learn>=1.3
      - joblib>=1.3
      - matplotlib>=3.7
      - pyyaml>=6.0
      - setproctitle>=1.3,<2

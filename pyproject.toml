[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cbm"
version = "0.1.0"
description = "ThyroidXL mask-free Stage-1 radiomics prediction and TU1.0 dictionary-panel Stage-2"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
dependencies = [
    # ---- deep learning ----
    "torch>=2.1",
    "torchvision>=0.16",     # ConvNeXt-Tiny backbone
    # ---- radiomics ----
    "pyradiomics==3.0.1",
    "SimpleITK>=2.2",
    # ---- data I/O ----
    "pillow>=10.0",
    "openpyxl>=3.1",         # TU1.0 workbook parsing
    # ---- scientific computing ----
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    # ---- visualization ----
    "matplotlib>=3.7",
    # ---- config & misc ----
    "pyyaml>=6.0",
    "setproctitle>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "ipython",
]

[tool.setuptools.packages.find]
include = ["cbm*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["archive", "experiments"]

[tool.ruff.lint]
# Enable: pycodestyle (E,W), pyflakes (F), import sorting (I), pyupgrade (UP).
select = ["E", "W", "F", "I", "UP"]
# Tolerate long lines and single-letter / lambda patterns (common in ML code).
ignore = ["E501", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Scripts (and comparison-layer adapters, same bootstrap) insert the repo
# root on sys.path before third-party imports.
"scripts/**/*.py" = ["E402"]
"comparisons/*/adapter/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["cbm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Let `tests/` import the top-level `scripts/` package and `cbm/` regardless of
# how pytest is invoked (plain `pytest`, `CBM_STRICT_DEPS=1 conda run -n env pytest`).
pythonpath = ["."]
markers = [
    # Synthetic-input training-path checks under scripts/thyroidxl/smoke/.
    # Run them with `pytest -m slow`; skip with `pytest -m "not slow"`.
    "slow: exercises the full training/evaluation pipeline (seconds, not milliseconds)",
]
